name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────
  # JOB 1：test
  # ─────────────────────────────
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Java build & test
        run: |
          cd java/wp/ai-ticket
          mvn clean package -DskipTests -q

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python install & test
        run: |
          cd llm
          pip install -r requirements.txt
          pytest tests/ -v --tb=short || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Nuxt static build
        run: |
          cd frontend
          pnpm install
          pnpm run generate

  # ─────────────────────────────
  # JOB 2：Build & Push Images
  # ─────────────────────────────
  build-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push java
        uses: docker/build-push-action@v5
        with:
          context: java/wp/ai-ticket
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ai-ticket-java:latest

      - name: Build & Push fastapi
        uses: docker/build-push-action@v5
        with:
          context: llm
          file: llm/api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ai-ticket-fastapi:latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Generate Nuxt static
        run: |
          cd frontend
          pnpm install
          pnpm run generate

      - name: Build & Push nginx
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ai-ticket-nginx:latest
