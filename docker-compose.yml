version: "3.9"

services:
  fastapi:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: fastapi
    environment:
      - TZ=Asia/Taipei
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8000:8000"

  postgres:
    image: postgres:16-alpine
    container_name: psql
    environment:
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: p@ssw0rd
      POSTGRES_DB: ai_ticket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
volumes:
  postgres_data: